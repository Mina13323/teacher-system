name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:

# A push that only changes docs does not need a full build.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # composer.json requires ^8.2; verify the floor and a current release.
        php: ['8.2', '8.3']

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # pdo_sqlite/sqlite3: phpunit.xml uses an in-memory sqlite database, so
          # no database service container is needed.
          extensions: dom, fileinfo, mbstring, pdo, pdo_sqlite, sqlite3, bcmath, intl
          coverage: none

      - name: Lint PHP files (parse check, no dependencies needed)
        run: |
          fails=0
          while IFS= read -r -d '' f; do
            out=$(php -l "$f" 2>&1) || { echo "::error::${out}"; echo "$out"; fails=1; }
          done < <(find app tests database bootstrap routes config -name '*.php' -print0)
          if [ "$fails" -ne 0 ]; then
            echo "PHP parse errors found."
            exit 1
          fi
          echo "All PHP files parse cleanly."

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: |
          set -o pipefail
          code=0
          php artisan test 2>&1 | tee test-output.log || code=$?
          if [ "$code" -ne 0 ]; then
            echo "::error::$(tail -c 1500 test-output.log | tr '\n' '~')"
            # Emit the numbered failure index in chunks so remote debugging
            # works without raw log access (max 50 annotations x ~3.5KB).
            grep -E -A 2 '^[0-9]+\) ' test-output.log | head -c 200000 > failed-index.txt || true
            split -b 3500 failed-index.txt failchunk_ || true
            n=0
            for f in failchunk_*; do
              [ -e "$f" ] || continue
              n=$((n+1))
              [ "$n" -gt 45 ] && break
              echo "::error::FAILIDX $f $(tr '\n' '~' < "$f")"
            done
          fi
          exit $code

  # Lock hygiene (opt-in): re-resolves composer.lock against the platform
  # pinned in composer.json (config.platform.php = 8.3.33). Only runs when the
  # commit message contains [regen-lock]. The lock committed at fd55e33 was
  # resolved on a PHP 8.4 machine and locked symfony/* v8.x (php >= 8.4.1),
  # which this matrix cannot install; this job rebuilds it and proves install +
  # tests before the result is committed from its artifact.
  regenerate-lock:
    name: Regenerate composer.lock (opt-in)
    if: contains(github.event.head_commit.message, '[regen-lock]')
    runs-on: ubuntu-latest
    # The lock must land on the branch; artifact download is not reliable from
    # every environment, so the job commits the file back with the repo token.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP (matches config.platform.php)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, fileinfo, mbstring, pdo, pdo_sqlite, sqlite3, bcmath, intl
          coverage: none

      - name: Re-resolve dependency tree (no scripts)
        run: |
          set -o pipefail
          composer update --no-interaction --no-progress --no-scripts -v 2>&1 | tee composer-update.log

      - name: Regenerate autoloader and discover packages
        run: |
          set -o pipefail
          composer dump-autoload 2>&1 | tee composer-scripts.log
          php artisan package:discover --ansi 2>&1 | tee -a composer-scripts.log

      - name: Fresh install from the new lock
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Commit the regenerated lock to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          if git diff --cached --quiet; then
            echo "composer.lock unchanged"
          else
            git commit -m "chore(deps): regenerate composer.lock for platform PHP 8.3.33"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Test suite must pass with the new lock
        run: |
          set -o pipefail
          code=0
          php artisan test 2>&1 | tee test-output.log || code=$?
          {
            echo "## php artisan test (tail)"
            echo '```'
            tail -n 120 test-output.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -ne 0 ]; then
            echo "::error::$(tail -c 1500 test-output.log | tr '\n' '~')"
            # Emit the numbered failure index in chunks so remote debugging
            # works without raw log access (max 50 annotations x ~3.5KB).
            grep -E -A 2 '^[0-9]+\) ' test-output.log | head -c 200000 > failed-index.txt || true
            split -b 3500 failed-index.txt failchunk_ || true
            n=0
            for f in failchunk_*; do
              [ -e "$f" ] || continue
              n=$((n+1))
              [ "$n" -gt 45 ] && break
              echo "::error::FAILIDX $f $(tr '\n' '~' < "$f")"
            done
          fi
          exit $code

      - name: Upload composer logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: composer-logs
          path: |
            composer-update.log
            composer-scripts.log
          if-no-files-found: ignore

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  guards:
    # Cheap checks that do not need a runtime. Each one exists because it has
    # already been violated once in this repository's history.
    name: Repo guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No environment file is tracked
        run: |
          if git ls-files | grep -E '(^|/)\.env(\.[a-z]+)?$' | grep -v '\.example$'; then
            echo "::error::An .env file is tracked in git. Remove it from the index."
            exit 1
          fi

      - name: No plaintext provisioning credential
        run: |
          if grep -rn "Mr\.Maher@systemforStudents" \
               --include='*.php' --include='*.md' --include='*.js' --include='*.vue' . ; then
            echo "::error::A previously committed plaintext credential reappeared."
            exit 1
          fi
          echo "No known plaintext credential present."

      - name: Pagination is capped
        run: |
          # per_page arrives from the client. Reading it directly bypasses
          # MAX_PER_PAGE, so every list endpoint must resolve it through
          # perPage() in the base Controller.
          raw=$(grep -rn --include='*.php' 'per_page' app/Http/Controllers \
            | grep -v 'Controllers/Controller.php' || true)
          if [ -n "$raw" ]; then
            echo "::error::per_page is read outside the base Controller:"
            echo "$raw"
            exit 1
          fi

          # And every paginate() call must actually use that helper.
          uncapped=$(grep -rn --include='*.php' 'paginate(' app/Http/Controllers \
            | grep -v 'perPage(' || true)
          if [ -n "$uncapped" ]; then
            echo "::error::paginate() called without perPage():"
            echo "$uncapped"
            exit 1
          fi
          echo "All paginated endpoints resolve their page size through perPage()."
